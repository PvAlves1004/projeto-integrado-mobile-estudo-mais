plugins {
    id 'com.google.gms.google-services'
    id 'com.google.firebase.appdistribution'
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.estudomais'
    compileSdk 35

    defaultConfig {
        applicationId "com.uniceplac.estudomais"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile     file("../keystore/estudomais.jks")
            storePassword System.getenv("KEYSTORE_PASS") ?: ""
            keyAlias      "estudomais"
            keyPassword   System.getenv("KEY_PASS") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled   true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            firebaseAppDistribution {
                appId        "1:1083693095672:android:82a9a3bb5916b597f0b90d"
                artifactType "APK"
                groups       "testers"
                releaseNotes "Build automático via GitHub Actions"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}